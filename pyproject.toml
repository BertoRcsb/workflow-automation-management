[tool.poetry]
name = "workflow-automation-management"
version = "0.1.0"
description = "Orchestration of release notes automation: Jira → Notion → Sync branches"
authors = ["Optimus Prime <ronan@example.com>"]
readme = "README.md"
packages = [{ include = "workflow_automation_management", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
pydantic = "^2.7.0"
pyyaml = "^6.0.2"
python-dotenv = "^1.0.0"
httpx = "^0.28.0"
requests = "^2.32.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.5.0"
black = "^24.4.0"
mypy = "^1.11.0"

[tool.poetry.scripts]
optimus-prime = "workflow_automation_management.interfaces.cli_orchestrator:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.report]
fail_under = 75

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
