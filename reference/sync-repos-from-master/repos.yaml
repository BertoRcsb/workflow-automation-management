# ============================================================================
# repos.yaml — CATALOGO CANONICO (sync-repos-from-master)
# ----------------------------------------------------------------------------
# COMO USAR (Optimus Prime): NUNCA reescreva/reformate/gere este arquivo.
# A UNICA edicao permitida e alternar o caractere '#' de linhas que JA EXISTEM:
#   - Passos 1/2: descomente APENAS 'name' + 'repository' dos repos do release;
#     mantenha o 'triggers:' de cada repo COMENTADO. Recomente o resto.
#   - Passo 3 (prod, apos OK PO/QA): descomente o bloco 'triggers:' do repo alvo.
#   - source/targets: descomente SO o bloco do passo atual (Passo 1 fica ativo).
# Se um repo/trigger nao existir aqui -> PARE e reporte (o Ronan adiciona). NUNCA crie a linha.
# Este catalogo SO CRESCE: adicionar novos repos quando surgirem; nunca remover.
# ============================================================================

# Default settings applied to every repository listed below.
defaults:
  # Provider currently supported by the application.
  provider: bitbucket

  # --- source/targets POR PASSO: descomente SO o bloco do passo atual ---
  # Passo 1 (pre-prod): prerelease -> teste_regressivo   [ATIVO por padrao]
  source: prerelease
  targets:
    - teste_regressivo
  # Passo 2 (prod): teste_regressivo -> master
  # source: teste_regressivo
  # targets:
  #   - master
  # Pos-deploy (propaga master de volta): master -> develop/stage/prerelease
  # source: master
  # targets:
  #   - develop
  #   - stage
  #   - prerelease

  # When true, skip PR creation when there is no diff between source and target.
  open_pr_only_if_diff: true

  # Keep false unless the workflow should merge approved PRs automatically.
  auto_merge: false

# Default GCP context for triggers associated with repositories.
cloud_build:
  defaults:
    project_id: grt-app-prod
    region: global
    source:
      branch: master

# ============================================================================
# CATALOGO DE REPOS — todos COMENTADOS por padrao.
